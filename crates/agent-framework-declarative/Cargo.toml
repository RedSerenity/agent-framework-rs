[package]
name = "agent-framework-declarative"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Declarative agents and workflows loaded from YAML/JSON specs"

[dependencies]
agent-framework-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
reqwest = { workspace = true, optional = true }
agent-framework-mcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
## `DefaultHttpRequestHandler` (reqwest-based) for `HttpRequestAction`.
http = ["dep:reqwest"]
## `DefaultMcpToolHandler` (agent-framework-mcp streamable HTTP) for `InvokeMcpTool`.
mcp = ["dep:agent-framework-mcp", "dep:reqwest", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
