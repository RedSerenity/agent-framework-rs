[package]
name = "agent-framework-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Core abstractions for agent-framework-rs: messages, chat clients, agents, tools, threads, middleware, memory, and workflows"

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true }
# `jcs-sha256` context identities for agent-hooks records, and the digest
# `FileSessionStore` names an over-long id by.
sha2 = "0.10"
tokio-stream = { workspace = true }
pin-project-lite = { workspace = true }
# Optional: GenAI metrics behind the `otel-metrics` feature. API crate only —
# no SDK/exporter is pulled in; see `observability` module docs.
opentelemetry = { workspace = true, optional = true }
# Optional: the OTLP export pipeline behind the `otel-export` feature. Only
# these are SDK/exporter crates — everything above stays API-only.
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` adds tokio's mock clock (`start_paused`, `pause`/`advance`) used
# by the retry-layer tests to assert backoff timing without real sleeps.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
# In-memory metric reader for `otel-metrics` tests only.
opentelemetry_sdk = { workspace = true }

[features]
# Enables the three GenAI histograms on `ObservableChatClient` and the
# function-invocation loop via the `opentelemetry` API crate. Purely additive:
# default behavior/build is unaffected when this is off, and the instruments
# are no-ops until the application installs a `MeterProvider`.
otel-metrics = ["dep:opentelemetry"]
# Ships a ready-made OTLP export pipeline (`observability::export`) so the
# spans and metrics above actually reach a backend. Implies `otel-metrics`,
# since the pipeline installs the `MeterProvider` those histograms record
# through. This is the only feature that pulls an OTel *SDK*.
otel-export = [
    "otel-metrics",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
